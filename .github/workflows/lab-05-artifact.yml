name: Lab 05 - Artifact

on:
  workflow_dispatch:

jobs:
  create-report:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create report
        run: |
          mkdir -p reports
          printf '{\n  "status": "ok",\n  "message": "artifact lab"\n}\n' > reports/result.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lab-report
          path: reports/result.json

  consume-report:
    runs-on: ubuntu-24.04
    needs: create-report

    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: lab-report
          path: downloaded-report

      - name: Inspect report
        run: cat downloaded-report/result.json
